name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - name: Install oras
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.2

      # PRs can't publish (no write to GHCR from forks); they just verify the
      # build is reproducible by comparing layer digests across packs.
      - name: Determine push mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "push=true"  >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "push=true"  >> "$GITHUB_OUTPUT"
            echo "tag=latest"  >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: steps.mode.outputs.push == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" \
          | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build (and maybe push) packs
        env:
          PUSH: ${{ steps.mode.outputs.push }}
          TAG: ${{ steps.mode.outputs.tag }}
        run: ./scripts/build-and-push.sh

      - name: Assert base-layer reuse
        run: |
          base_digest="$(sha256sum out/base.tar.gz | awk '{print $1}')"
          echo "base layer sha256:${base_digest}"
          # Re-tar the base directory and confirm the digest is stable run-to-run.
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 \
              --numeric-owner --format=ustar -cf - -C packs/base . \
            | gzip -n | sha256sum | awk '{print $1}' | tee /tmp/recomputed
          test "$(cat /tmp/recomputed)" = "${base_digest}"

      - uses: actions/upload-artifact@v4
        with:
          name: layer-tarballs
          path: out/*.tar.gz
          if-no-files-found: error
