# Shared baseline config that every pack inherits.
#
# In a real deployment this directory would contain config trees that are
# stable across packs (e.g. anti-cheat, common loggers, server-icon paths,
# Geyser/Floodgate config, etc.).
#
# The point of putting these in `packs/base` is that the resulting tar.gz
# layer is byte-identical across all derived packs, so the OCI registry
# stores it exactly once and clients only download it once.

motd=An OCI-distributed modpack
view-distance=10
simulation-distance=10
